<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixVerse iOS Pro Ultimate</title>
    <style>
        :root {
            --bg-main: #070913;
            --bg-panel: #101423;
            --bg-card: #181f33;
            --primary: #8338ec;
            --primary-glow: rgba(131, 56, 236, 0.4);
            --accent: #ff006e;
            --text-main: #ffffff;
            --text-muted: #8c95b2;
            --border: rgba(255, 255, 255, 0.08);
            --success: #38b000;
        }

        [data-theme="light"] {
            --bg-main: #f4f6f9;
            --bg-panel: #ffffff;
            --bg-card: #eaedf2;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --accent: #ec4899;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: rgba(0, 0, 0, 0.08);
            --success: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .logo-text h1 {
            font-size: 15px;
            font-weight: 700;
        }

        .logo-text span {
            font-size: 11px;
            color: var(--success);
            font-weight: 600;
        }

        .top-btns {
            display: flex;
            gap: 6px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
        }

        .config-bar {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .config-bar::-webkit-scrollbar { display: none; }

        .select-opt {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            white-space: nowrap;
        }

        .nav-tabs {
            display: flex;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .view-section {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px;
            scroll-behavior: smooth;
        }

        .view-section.active {
            display: flex;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 92%;
            margin-bottom: 14px;
        }

        .message-row.user { align-self: flex-end; }
        .message-row.bot { align-self: flex-start; }

        .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .user .bubble {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot .bubble {
            background: var(--bg-panel);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .studio-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            width: 100%;
            margin-top: 6px;
        }

        .studio-header {
            padding: 10px 14px;
            font-size: 12px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-view {
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
        }

        .spinner-ring {
            width: 38px;
            height: 38px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: var(--bg-card);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.3s;
        }

        .canvas-player-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.75);
            color: white;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .video-controls-bar {
            padding: 10px 14px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 6px;
            justify-content: space-between;
        }

        .ctrl-btn {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .ctrl-btn:active {
            background: var(--primary);
            color: white;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .gallery-item {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
        }

        .presets-row {
            display: flex;
            gap: 6px;
            padding: 6px 16px;
            overflow-x: auto;
            scrollbar-width: none;
            background: var(--bg-main);
        }
        .presets-row::-webkit-scrollbar { display: none; }

        .preset-chip {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }

        .footer-input {
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-box {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 16px;
        }

        input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 14px;
            padding: 12px 0;
        }

        input::placeholder { color: var(--text-muted); }

        .send-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo-area">
            <div class="logo-icon">✨</div>
            <div class="logo-text">
                <h1>PixVerse iOS Pro</h1>
                <span>🟢 Активно</span>
            </div>
        </div>
        <div class="top-btns">
            <button class="btn-icon" onclick="toggleTheme()">🌓</button>
            <button class="btn-icon" onclick="clearAllData()">🗑️</button>
        </div>
    </header>

    <div class="config-bar">
        <select class="select-opt" id="engineModel">
            <option value="PixVerse-v3">Model: PixVerse v3.0 Ultra</option>
            <option value="Sora-8K">Model: Sora Pro 8K</option>
        </select>
        <select class="select-opt" id="aspectRatio">
            <option value="16:9">16:9 (Landscape)</option>
            <option value="9:16">9:16 (Stories)</option>
        </select>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('chat', this)">💬 Генератор</button>
        <button class="tab-btn" onclick="switchTab('gallery', this)">📁 Галерея (<span id="galleryCount">0</span>)</button>
    </div>

    <div class="view-section active" id="chatSection">
        <div id="chatFeed">
            <div class="message-row bot">
                <div class="bubble">Привіт! Опиши будь-яку фантазію, і я згенерую для тебе анімоване AI-відео! 👇</div>
            </div>
        </div>
    </div>

    <div class="view-section" id="gallerySection">
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <div class="presets-row">
        <div class="preset-chip" onclick="quickSend('Кіт у скафандрі гуляє поверхнею Марса')">🚀 Марсіанський кіт</div>
        <div class="preset-chip" onclick="quickSend('Неонове кіберпанк місто під час зливи')">🌆 Кіберпанк</div>
    </div>

    <div class="footer-input">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Опишіть відео..." autocomplete="off">
        </div>
        <button class="send-btn" onclick="startGeneration()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
    </div>

    <script>
        const chatFeed = document.getElementById('chatFeed');
        const galleryGrid = document.getElementById('galleryGrid');
        const galleryCount = document.getElementById('galleryCount');
        const userInput = document.getElementById('userInput');

        let savedVideos = JSON.parse(localStorage.getItem('pixverse_ios_gallery')) || [];
        window.addEventListener('DOMContentLoaded', renderGallery);

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startGeneration();
        });

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            if(tabName === 'chat') {
                document.getElementById('chatSection').classList.add('active');
            } else {
                document.getElementById('gallerySection').classList.add('active');
                renderGallery();
            }
        }

        function toggleTheme() {
            document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        function clearAllData() {
            if(confirm("Очистити все?")) {
                localStorage.removeItem('pixverse_ios_gallery');
                savedVideos = [];
                chatFeed.innerHTML = `<div class="message-row bot"><div class="bubble">Історію очищено!</div></div>`;
                renderGallery();
            }
        }

        function quickSend(text) {
            userInput.value = text;
            startGeneration();
        }

        function startGeneration() {
            const query = userInput.value.trim();
            if (!query) return;

            appendMsg(query, 'user');
            userInput.value = '';

            const uid = 'gen-' + Date.now();
            const botHtml = `
                <div class="bubble" style="margin-bottom: 6px;">Генерація за запитом: <b>"${query}"</b>... Рендеринг нейро-кадрів.</div>
                <div class="studio-card">
                    <div class="studio-header">
                        <span>⚡ AI Studio Engine</span>
                        <span id="${uid}-pct">0%</span>
                    </div>
                    <div class="progress-view" id="${uid}-loadbox">
                        <div class="spinner-ring"></div>
                        <span style="font-size: 12px; color: var(--text-muted);" id="${uid}-status-text">Синтез ділянок кадру...</span>
                        <div class="progress-bar-track">
                            <div class="progress-bar-fill" id="${uid}-bar"></div>
                        </div>
                    </div>
                    <div class="canvas-player-wrap" id="${uid}-playerbox">
                        <div class="video-badge">PixVerse AI • HD</div>
                        <canvas id="${uid}-canvas" width="640" height="360"></canvas>
                    </div>
                    <div class="video-controls-bar" id="${uid}-ctrls" style="display: none;">
                        <button class="ctrl-btn" onclick="toggleAnim('${uid}')">▶️ Пауза / Пуск</button>
                        <button class="ctrl-btn" onclick="saveToGallery('${query.replace(/'/g, "")}')">💾 Зберегти</button>
                    </div>
                </div>
            `;

            appendMsg("", 'bot', botHtml);
            runCanvasSimulation(uid, query);
        }

        function appendMsg(text, sender, html = '') {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;
            if (text) {
                const b = document.createElement('div');
                b.className = 'bubble';
                b.textContent = text;
                row.appendChild(b);
            }
            if (html) {
                const h = document.createElement('div');
                h.innerHTML = html;
                row.appendChild(h);
            }
            chatFeed.appendChild(row);
            document.getElementById('chatSection').scrollTop = document.getElementById('chatSection').scrollHeight;
        }

        let activeAnimations = {};

        function runCanvasSimulation(id, promptText) {
            let p = 0;
            const pctEl = document.getElementById(`${id}-pct`);
            const barEl = document.getElementById(`${id}-bar`);
            const statEl = document.getElementById(`${id}-status-text`);
            const loadBox = document.getElementById(`${id}-loadbox`);
            const playerBox = document.getElementById(`${id}-playerbox`);
            const ctrls = document.getElementById(`${id}-ctrls`);
            const canvas = document.getElementById(`${id}-canvas`);
            const ctx = canvas.getContext('2d');

            const timer = setInterval(() => {
                p += Math.floor(Math.random() * 15) + 8;
                if (p >= 100) {
                    p = 100;
                    clearInterval(timer);
                    pctEl.textContent = "Готово!";
                    barEl.style.width = "100%";

                    setTimeout(() => {
                        loadBox.style.display = "none";
                        playerBox.style.display = "flex";
                        ctrls.style.display = "flex";
                        
                        // Запуск анімації на Canvas спеціально для iPhone
                        startCanvasLoop(ctx, canvas, promptText, id);
                        saveToGallerySilent(promptText);
                    }, 400);
                } else {
                    pctEl.textContent = p + "%";
                    barEl.style.width = p + "%";
                    if(p > 50) statEl.textContent = "Фінальна оптимізація кадрів...";
                }
            }, 250);
        }

        function startCanvasLoop(ctx, canvas, text, id) {
            let angle = 0;
            let running = true;
            activeAnimations[id] = () => { running = !running; };

            function render() {
                if(!document.body.contains(canvas)) return;
                if(running) {
                    angle += 0.03;
                    ctx.fillStyle = "#0a0c1b";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Малюємо рухомі неонові елементи (імітація нейромережі)
                    for(let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        ctx.arc(
                            canvas.width/2 + Math.sin(angle + i) * 120,
                            canvas.height/2 + Math.cos(angle * 0.7 + i) * 50,
                            30 + i * 10, 0, Math.PI * 2
                        );
                        ctx.fillStyle = i % 2 === 0 ? "rgba(131, 56, 236, 0.25)" : "rgba(255, 0, 110, 0.25)";
                        ctx.fill();
                    }

                    // Текст запиту користувача на екрані відео
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 20px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("✨ AI Video: " + text.substring(0, 24) + "...", canvas.width/2, canvas.height/2 + 8);
                }
                requestAnimationFrame(render);
            }
            render();
        }

        function toggleAnim(id) {
            if(activeAnimations[id]) activeAnimations[id]();
        }

        function saveToGallerySilent(prompt) {
            const item = { id: Date.now(), prompt: prompt, date: new Date().toLocaleDateString() };
            if(!savedVideos.some(v => v.prompt === prompt)) {
                savedVideos.unshift(item);
                localStorage.setItem('pixverse_ios_gallery', JSON.stringify(savedVideos));
                renderGallery();
            }
        }

        function saveToGallery(prompt) {
            saveToGallerySilent(prompt);
            alert("Успішно збережено у Галерею!");
        }

        function renderGallery() {
            galleryCount.textContent = savedVideos.length;
            if(savedVideos.length === 0) {
                galleryGrid.innerHTML = `<p style="text-align: center; color: var(--text-muted); margin-top: 30px; font-size: 13px;">Галерея поки порожня.</p>`;
                return;
            }
            galleryGrid.innerHTML = "";
            savedVideos.forEach(item => {
                galleryGrid.innerHTML += `
                    <div class="gallery-item">
                        <strong style="font-size: 13px;">${item.prompt}</strong>
                        <p style="color: var(--text-muted); font-size: 11px; margin-top: 4px;">Створено: ${item.date}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
